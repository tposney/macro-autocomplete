variables:
  PACKAGE_NAME: macro-autocomplete
  PACKAGE_ARCHIVE: $PACKAGE_NAME-$CI_COMMIT_TAG
  PACKAGE_REGISTRY_URL: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$PACKAGE_NAME
  PACKAGE_REGISTRY_URL_FULL: $PACKAGE_REGISTRY_URL/$CI_COMMIT_TAG
  PACKAGE_TYPE: module

stages:
  - prepare-release
  - release
  - publish

publish-artifacts:
  stage: prepare-release
  image: curlimages/curl:latest
  script:
    - 'curl --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file package/$PACKAGE_TYPE.json "${PACKAGE_REGISTRY_URL_FULL}/${PACKAGE_TYPE}.json"'
    - 'curl --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file package/$PACKAGE_ARCHIVE.zip "${PACKAGE_REGISTRY_URL_FULL}/${PACKAGE_ARCHIVE}.zip"'
  rules:
    - if: $CI_COMMIT_TAG

release_job:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "running release_job"
  release:
    tag_name: '$CI_COMMIT_TAG'
    description: 'Release $CI_COMMIT_TAG'
    assets:
      links:
        - name: '$PACKAGE_ARCHIVE.zip'
          url: "${PACKAGE_REGISTRY_URL_FULL}/${PACKAGE_ARCHIVE}.zip"
          filepath: '/$PACKAGE_ARCHIVE.zip'
        - name: '$PACKAGE_TYPE.json'
          url: "${PACKAGE_REGISTRY_URL_FULL}/${PACKAGE_TYPE}.json"
          filepath: '/$PACKAGE_TYPE.json'

# Update files for Foundry, served from GitLab Pages (limited per visitor, not per file like raw repository files):
# <pages url>/<line>/module.json and the zip it names, for each release line's branch head. GitLab replaces the whole
# site on each deployment, so every line is rebuilt. Runs on a release tag, by hand (Run pipeline) or by trigger token.
pages:
  stage: publish
  image: alpine:latest
  variables:
    GIT_DEPTH: 0
    RELEASE_LINES: "v13 v14"
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "trigger"
  script:
    - apk add --no-cache git jq
    - |
      set -e
      for line in $RELEASE_LINES; do
        git fetch --quiet origin "+refs/heads/$line:refs/remotes/origin/$line"
        git show "origin/$line:package/$PACKAGE_TYPE.json" > manifest.json
        version=$(jq -r .version manifest.json)
        zip=$(basename "$(jq -r .download manifest.json)")
        mkdir -p "public/$line"
        git show "origin/$line:package/$zip" > "public/$line/$zip"
        jq --arg manifest "$CI_PAGES_URL/$line/$PACKAGE_TYPE.json" --arg download "$CI_PAGES_URL/$line/$zip" \
          '.manifest = $manifest | .download = $download' manifest.json > "public/$line/$PACKAGE_TYPE.json"
        echo "$line: $version $zip"
      done
  artifacts:
    paths:
      - public
